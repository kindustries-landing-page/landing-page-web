services:
  web:
    image: ${LANDING_WEB_IMAGE:?LANDING_WEB_IMAGE is required}
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - PORT=3000
      - API_UPSTREAM_URL=http://landing-page-klotus-production-__TARGET_HOST__-api-api-1:3000
    expose: ['3000']
    ports: ['__TARGET_IP__:__TARGET_PORT__:3000']
    networks: [npm-network]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
networks:
  npm-network:
    external: true
    name: npm-network
